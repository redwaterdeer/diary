<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    
    <meta name="theme-color" content="#5c0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="오늘의 씀" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>신규 등록 - 오늘의 씀</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <!-- 7번 화면: 신규 등록 (5번과 동일 UI) -->
      <main class="diary-screen" data-screen="7">
        <span class="screen-badge" aria-hidden="true">7</span>

        <div class="diary-date-wrap" id="diaryDateWrap">
          <button type="button" class="diary-date" id="diaryDate">
            2026년 07월 17일 금요일
          </button>
          <input type="date" class="diary-date-input" id="diaryDateInput" />
        </div>

        <div class="diary-title-row">
          <span class="diary-title-label">제목</span>
          <input
            class="diary-title-input"
            id="diaryTitle"
            type="text"
            maxlength="40"
            placeholder=""
          />
        </div>

        <div class="diary-photo" id="diaryPhotoBox">
          <img class="diary-photo-preview" id="diaryPhotoPreview" alt="" hidden />
          <div class="diary-photo-text" id="diaryPhotoText">
            <button type="button" class="diary-photo-pick" id="diaryGalleryBtn">
              사진 등록
            </button>
            <span class="diary-photo-sep" aria-hidden="true">|</span>
            <button type="button" class="diary-photo-pick" id="diaryCameraBtn">
              촬영
            </button>
          </div>
          <input
            type="file"
            id="diaryGalleryInput"
            accept="image/*"
            hidden
          />
          <input
            type="file"
            id="diaryCameraInput"
            accept="image/*"
            capture="environment"
            hidden
          />
        </div>

        <textarea
          class="diary-content"
          id="diaryContent"
          rows="6"
          placeholder=""
        ></textarea>
        <textarea
          class="diary-note"
          id="diaryNote"
          rows="2"
          placeholder=""
        ></textarea>

        <div class="diary-actions">
          <button type="button" class="diary-btn" id="bibleBtn">성경 말씀</button>
          <button type="button" class="diary-btn" id="saveBtn">등록</button>
        </div>

        <nav class="diary-footer">
          <a href="feed.html" id="diaryPrev">이전</a>
          <span aria-hidden="true">|</span>
          <a href="feed.html" class="diary-exit" id="diaryExit">나가기</a>
        </nav>
      </main>
    </div>

    <div class="app-dialog" id="saveOkDialog" hidden>
      <div class="app-dialog-card" role="dialog" aria-modal="true">
        <p class="app-dialog-message">정상 등록이 되었습니다.</p>
        <div class="app-dialog-actions app-dialog-actions-single">
          <button type="button" class="app-dialog-btn" id="saveOkBtn">확인</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="data-store.js"></script>
    <script src="diary.js"></script>
    <script src="pwa.js"></script>
  </body>
</html>
