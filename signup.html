<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    
    <meta name="theme-color" content="#5c0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="오늘의 씀" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>신규 가입 - 오늘의 씀</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <!-- 2번 화면: 신규 가입 -->
      <main class="signup-screen" data-screen="2">
        <img
          class="screen-bg-gray"
          src="login-bg.png?v=12"
          alt=""
          aria-hidden="true"
        />

        <span class="screen-badge" aria-hidden="true">2</span>

        <header class="signup-brand">
          <h1>신규 가입</h1>
        </header>

        <form class="signup-form" id="signupForm" autocomplete="off">
          <label class="field field-signup">
            <span class="sr-only">이름</span>
            <span class="field-label field-label-name" aria-hidden="true"
              >이 름</span
            >
            <span class="field-divider" aria-hidden="true">|</span>
            <input type="text" name="name" required />
          </label>

          <label class="field field-signup">
            <span class="sr-only">비밀번호</span>
            <span class="field-label" aria-hidden="true">비밀번호</span>
            <span class="field-divider" aria-hidden="true">|</span>
            <input type="password" name="password" required />
          </label>

          <button type="submit" class="signup-submit">등록</button>
        </form>

        <a href="index.html" class="signup-exit" id="exitLink">나가기</a>
      </main>
    </div>

    <script src="auth.js"></script>
    <script src="signup.js"></script>
      <script src="pwa.js"></script>
  </body>
</html>
