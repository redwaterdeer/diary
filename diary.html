<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    
    <meta name="theme-color" content="#5c0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="오늘의 씀" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>일기 작성 - 오늘의 씀</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <!-- 5번 화면: 일기 작성 -->
      <main class="diary-screen" data-screen="5">
        <span class="screen-badge" aria-hidden="true">5</span>

        <div class="diary-date" id="diaryDate">2026년 07월 17일 금요일</div>

        <div class="diary-title-row">
          <span class="diary-title-label">제목</span>
          <input
            class="diary-title-input"
            id="diaryTitle"
            type="text"
            maxlength="40"
            placeholder=""
          />
        </div>

        <button type="button" class="diary-photo" id="diaryPhotoBtn">
          <img class="diary-photo-preview" id="diaryPhotoPreview" alt="" hidden />
          <span class="diary-photo-text" id="diaryPhotoText"
            >사진 등록 | 촬영</span
          >
          <input
            type="file"
            id="diaryPhotoInput"
            accept="image/*"
            capture="environment"
            hidden
          />
        </button>

        <textarea
          class="diary-content"
          id="diaryContent"
          rows="6"
          placeholder=""
        ></textarea>
        <textarea
          class="diary-note"
          id="diaryNote"
          rows="2"
          placeholder=""
        ></textarea>

        <div class="diary-actions">
          <button type="button" class="diary-btn" id="bibleBtn">성경 말씀</button>
          <button type="button" class="diary-btn" id="saveBtn">등록</button>
        </div>

        <a href="calendar.html" class="diary-exit" id="diaryExit">나가기</a>
      </main>
    </div>

    <script src="diary.js"></script>
      <script src="pwa.js"></script>
  </body>
</html>
