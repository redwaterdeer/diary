<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    
    <meta name="theme-color" content="#5c0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="오늘의 씀" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>오늘의 씀</title>
    <link rel="stylesheet" href="style.css?v=13" />
  </head>
  <body>
    <div class="phone">
      <main class="login-screen" data-screen="1">
        <img
          class="login-bg"
          src="login-bg.png?v=12"
          alt=""
          aria-hidden="true"
        />
        <span class="screen-badge" aria-hidden="true">1</span>

        <header class="brand">
          <h1>오늘의 씀</h1>
        </header>

        <div class="login-form" id="loginForm" data-lpignore="true" data-1p-ignore="true">
          <div class="field" id="fieldId" data-lpignore="true">
            <span class="sr-only">이름</span>
            <span class="field-label field-label-name" aria-hidden="true">이 름</span>
            <span class="field-divider" aria-hidden="true">|</span>
            <div
              class="field-edit"
              id="loginId"
              role="textbox"
              aria-label="이름"
              contenteditable="true"
              inputmode="text"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
              data-lpignore="true"
              data-1p-ignore="true"
            ></div>
          </div>

          <div class="field" id="fieldPw" data-lpignore="true">
            <span class="sr-only">비밀번호</span>
            <span class="field-label" aria-hidden="true">비밀번호</span>
            <span class="field-divider" aria-hidden="true">|</span>
            <div
              class="field-edit field-secret"
              id="loginPw"
              role="textbox"
              aria-label="비밀번호"
              contenteditable="true"
              inputmode="text"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
              data-lpignore="true"
              data-1p-ignore="true"
            ></div>
          </div>

          <div class="actions">
            <a href="signup.html" class="action-link" id="signupLink">신규가입</a>
            <span class="action-divider" aria-hidden="true">|</span>
            <button type="button" class="action-link action-btn" id="loginBtn">
              로그인
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="auth.js?v=13"></script>
    <script src="login.js?v=13"></script>
    <script src="pwa.js?v=13"></script>
  </body>
</html>
