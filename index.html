<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    
    <meta name="theme-color" content="#5c0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="오늘의 씀" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>오늘의 씀</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <main class="login-screen" data-screen="1">
        <img
          class="login-bg"
          src="login-bg.png?v=12"
          alt=""
          aria-hidden="true"
        />
        <span class="screen-badge" aria-hidden="true">1</span>

        <header class="brand">
          <h1>오늘의 씀</h1>
        </header>

        <form class="login-form" id="loginForm" autocomplete="off">
          <label class="field">
            <span class="sr-only">이름</span>
            <span class="field-label field-label-name" aria-hidden="true">이 름</span>
            <span class="field-divider" aria-hidden="true">|</span>
            <input
              type="text"
              name="name"
              required
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              readonly
            />
          </label>

          <label class="field">
            <span class="sr-only">비밀번호</span>
            <span class="field-label" aria-hidden="true">비밀번호</span>
            <span class="field-divider" aria-hidden="true">|</span>
            <input
              type="password"
              name="password"
              required
              autocomplete="new-password"
              readonly
            />
          </label>

          <div class="actions">
            <a href="signup.html" class="action-link" id="signupLink">신규가입</a>
            <span class="action-divider" aria-hidden="true">|</span>
            <button type="submit" class="action-link action-btn">로그인</button>
          </div>
        </form>
      </main>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
      <script src="pwa.js"></script>
  </body>
</html>
